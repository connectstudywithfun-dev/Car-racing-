<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Turbo Rush - endless racing game with bikes, cars and a truck on Highway, Village and Ocean tracks.">
<meta name="theme-color" content="#f7f3f0">
<title>Turbo Rush - Amrit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<style>
:root{--bg:#f7f3f0;--card:#fff;--text:#3b2f2a;--muted:#8c786d;--primary:#964B00;--border:#e3d9d2;--adbar:#ece7e2;--chip:#f0eae5}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
.page{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center}
.stage{flex:1;min-height:0;width:100%;max-width:520px;position:relative;overflow:hidden;touch-action:none;background:#8fcf4a;box-shadow:0 0 24px rgba(0,0,0,.18)}
#cv,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}#cv{pointer-events:none}#pv{display:none!important}#lockI{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:3.4rem;pointer-events:none;filter:drop-shadow(0 3px 6px #0006)}footer.stop::before{animation-play-state:paused}
.layer{position:absolute;inset:0;display:flex;flex-direction:column}.hide{display:none!important}
/* ---------- menu ---------- */
#menu{background:linear-gradient(180deg,rgba(247,243,240,.97),rgba(247,243,240,0) 16%,rgba(247,243,240,0) 55%,rgba(247,243,240,.97) 72%);padding:10px 12px 12px;gap:6px}
.mtop{display:flex;align-items:center;justify-content:space-between;flex:none}
.logo{font-weight:900;font-size:1.75rem;line-height:.95;letter-spacing:1px;font-style:italic;background:linear-gradient(90deg,#d84315,#ff8f00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.logo small{display:block;font-size:.6rem;letter-spacing:.38em;-webkit-text-fill-color:#8c786d;font-style:normal;font-weight:800;margin-top:3px}
.ib{background:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:1.15rem;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.best{align-self:center;flex:none;display:flex;gap:8px;align-items:baseline;background:#fff;border:2px solid #ffd180;border-radius:20px;padding:4px 18px;color:#e65100;box-shadow:0 3px 0 #ffd180}
.best span{font-size:.6rem;letter-spacing:.16em;color:#8c786d;font-weight:800}.best b{font-size:1.35rem;font-weight:900}
.carwrap{flex:1;min-height:0;position:relative;cursor:grab;touch-action:pan-y}
#pv{position:absolute;inset:0;width:100%;height:100%}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2);font-size:1.4rem;font-weight:900;color:var(--primary);line-height:1}
.arr.l{left:0}.arr.r{right:0}
.vinfo{text-align:center;flex:none}.vinfo b{font-size:1.25rem;font-weight:900}.vinfo span.t{display:block;font-size:.68rem;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.stats{display:flex;gap:12px;justify-content:center;margin-top:5px}.st{font-size:.56rem;font-weight:800;color:var(--muted);letter-spacing:.1em;width:28%;text-align:left}
.st i{display:block;height:6px;border-radius:3px;background:#e4dbd4;margin-top:3px;overflow:hidden}.st i u{display:block;height:100%;background:linear-gradient(90deg,#ffb300,#e65100);border-radius:3px;transition:width .3s}
.dots{display:flex;gap:6px;justify-content:center;flex:none}.dots i{width:7px;height:7px;border-radius:4px;background:#d8cdc4;transition:all .2s}.dots i.on{background:var(--primary);width:18px}
.tracks{display:flex;gap:8px;flex:none}
.trk{flex:1;padding:6px 4px 7px;border-radius:14px;border:2px solid var(--border);background:#fff;text-align:center;font-weight:800;font-size:.72rem;color:var(--text);box-shadow:0 3px 0 var(--border)}
.trk i{display:block;height:28px;border-radius:9px;margin-bottom:4px;font-style:normal;font-size:1.05rem;line-height:28px}
.trk.on{border-color:var(--primary);box-shadow:0 3px 0 var(--primary);color:var(--primary)}
.t0 i{background:linear-gradient(90deg,#8fcf4a 18%,#4e525b 18% 82%,#8fcf4a 82%)}.t1 i{background:linear-gradient(90deg,#b5c968 18%,#867b70 18% 82%,#b5c968 82%)}.t2 i{background:linear-gradient(90deg,#f3dca2 18%,#575c66 18% 70%,#29b6f6 70%)}
.start{flex:none;padding:15px;font-size:1.3rem;font-weight:900;letter-spacing:.14em;color:#fff;border:0;border-radius:18px;background:linear-gradient(180deg,#ff9a3d,#f0522d);box-shadow:0 7px 0 #a8340f,0 12px 18px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4);text-shadow:0 2px 0 rgba(0,0,0,.2);margin-top:4px}
.start:active{transform:translateY(5px);box-shadow:0 2px 0 #a8340f,0 5px 8px rgba(0,0,0,.25)}
/* ---------- HUD ---------- */
#hud{pointer-events:none}
#hud button{pointer-events:auto}
.htop{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px}
.hb{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:1.05rem;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hsc{text-align:center;background:rgba(255,255,255,.88);border-radius:16px;padding:3px 18px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hsc b{display:block;font-size:1.6rem;font-weight:900;color:#d84315;line-height:1.1}.hsc span{font-size:.55rem;letter-spacing:.2em;font-weight:800;color:var(--muted)}
.hsp{text-align:right;background:rgba(255,255,255,.88);border-radius:14px;padding:3px 10px;box-shadow:0 2px 6px rgba(0,0,0,.25);min-width:60px}
.hsp b{font-size:1.1rem;font-weight:900;color:#37474f}.hsp span{display:block;font-size:.5rem;letter-spacing:.14em;font-weight:800;color:var(--muted)}
#shield{position:absolute;top:56px;left:12px;font-size:1.1rem;letter-spacing:2px}
#cd{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:5rem;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 24px rgba(0,0,0,.4);font-style:italic}
.boost{position:absolute;right:14px;bottom:16px;width:70px;height:70px;border-radius:50%;border:0;font-size:1.9rem;color:#fff;background:radial-gradient(circle at 35% 30%,#7fe0ff,#1e88e5 70%);box-shadow:0 5px 0 #0d47a1,0 8px 14px rgba(0,0,0,.3);line-height:1}
.boost:active{transform:translateY(4px);box-shadow:0 1px 0 #0d47a1}.boost.off{filter:grayscale(.9) brightness(1.15);opacity:.75}.boost.on{animation:pulse .5s infinite alternate}
.boost i{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;border-radius:12px;background:#ffb300;color:#3b2f2a;font-style:normal;font-size:.85rem;font-weight:900;line-height:24px;text-align:center;border:2px solid #fff}
@keyframes pulse{to{box-shadow:0 5px 0 #0d47a1,0 0 24px 8px rgba(80,200,255,.8)}}
/* ---------- panels ---------- */
#over,#pause{background:rgba(30,25,20,.55);align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.panel{background:#fff;border-radius:20px;padding:20px 18px;width:100%;max-width:310px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.panel h2{font-size:1.7rem;font-weight:900;font-style:italic;color:#d84315}.panel .big{font-size:2.6rem;font-weight:900;color:var(--primary);line-height:1.1}.panel p{font-size:.85rem;color:var(--muted);margin:2px 0 8px;font-weight:600}
.pb{display:block;width:100%;padding:12px;margin-top:8px;font-size:1rem;font-weight:800;border:0;border-radius:12px;background:linear-gradient(180deg,#ff9a3d,#f0522d);color:#fff;box-shadow:0 4px 0 #a8340f}.pb.g{background:var(--chip);color:var(--text);box-shadow:0 4px 0 var(--border)}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #a8340f}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:20;padding:16px}
.box{background:#fff;padding:18px;border-radius:16px;width:100%;max-width:330px;box-shadow:0 10px 25px rgba(0,0,0,.3)}.box h3{text-align:center;margin-bottom:12px;font-size:1.2rem}
.row{margin-bottom:12px}.row label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:4px}
.row input[type=range]{width:100%;accent-color:#e65100;height:26px}
.opt{width:100%;padding:9px;border:2px solid var(--border);background:#fff;border-radius:10px;font-weight:800;font-size:.85rem}.opt.on{border-color:var(--primary);color:var(--primary);background:#fff4e0}
/* ---------- footer ---------- */
footer{flex:none;width:100%;max-width:520px;position:relative;overflow:hidden;text-align:center;background:linear-gradient(90deg,var(--g) 0 15%,var(--r) 15% 85%,var(--g2) 85%)}
footer.f0{--g:#8fcf4a;--g2:#8fcf4a;--r:#4e525b;--l:rgba(255,255,255,.92)}footer.f1{--g:#b5c968;--g2:#b5c968;--r:#867b70;--l:rgba(245,230,160,.4)}footer.f2{--g:#f3dca2;--g2:#29b6f6;--r:#575c66;--l:rgba(255,255,255,.9)}
footer::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(32.5% - 1.5px),var(--l) 0 calc(32.5% + 1.5px),transparent 0 calc(50% - 1.5px),var(--l) 0 calc(50% + 1.5px),transparent 0 calc(67.5% - 1.5px),var(--l) 0 calc(67.5% + 1.5px),transparent 0);-webkit-mask:linear-gradient(180deg,#000 30px,transparent 30px) 0 0/100% 56px;mask:linear-gradient(180deg,#000 30px,transparent 30px) 0 0/100% 56px;animation:fm .45s linear infinite}
@keyframes fm{to{-webkit-mask-position:0 56px;mask-position:0 56px}}
footer .copy,footer .adbar{position:relative}footer .copy{color:#fff;text-shadow:0 1px 2px #0008}footer .copy strong{color:#ffd180}footer .adlabel{color:#fffc}
.cbtn{position:absolute;bottom:16px;width:74px;height:74px;border-radius:50%;border:0;font-size:1.8rem;color:#fff;background:radial-gradient(circle at 35% 30%,#ffb74d,#e65100 70%);box-shadow:0 5px 0 #8f2f00,0 8px 14px rgba(0,0,0,.3);line-height:1}.cbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #8f2f00}.cbtn.l{left:14px}.cbtn.r{left:98px}
#ctlBtn{position:absolute;right:10px;top:62px}#coinHud{position:absolute;left:12px;top:80px;font-weight:900;color:#fff;text-shadow:0 2px 3px #0008}
.copy{font-size:.72rem;color:var(--muted);padding:4px 10px 0}.copy strong{color:var(--primary);font-weight:800}
.adbar{width:100%;padding:2px 0 calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}.adcard{max-width:96%;text-align:center}
.adlabel{font-size:.5rem;letter-spacing:.1em;color:var(--muted);margin-bottom:2px;text-transform:uppercase}
.adslot{position:relative;width:320px;height:50px;max-width:100%;background:#fff;border-radius:4px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.ad-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f3ece4;color:var(--primary);font-size:.72rem;font-weight:600}

.page{position:relative}
footer,footer.f0,footer.f1,footer.f2{position:absolute!important;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;overflow:visible!important;pointer-events:none;background:linear-gradient(0deg,rgba(8,10,14,.5),rgba(8,10,14,0))!important;--g:transparent;--g2:transparent;--r:transparent}
footer::before{display:none!important}.adslot{pointer-events:auto}
footer.inmenu{background:none!important}footer.inmenu .copy{color:var(--muted);text-shadow:none}footer.inmenu .copy strong{color:var(--primary)}footer.inmenu .adlabel{color:var(--muted)}
.boost,.cbtn{bottom:calc(14px + var(--fh,95px))}#menu{padding-bottom:calc(12px + var(--fh,95px))}
#grade,#vig{position:absolute;inset:0;pointer-events:none}#grade{mix-blend-mode:soft-light}#vig{background:radial-gradient(ellipse at 50% 52%,rgba(0,0,0,0) 52%,rgba(0,0,0,.4) 100%)}
</style>
</head>
<body>
<div class="page">
<div class="stage" id="stage">
  <canvas id="gl"></canvas><div id="grade"></div><div id="vig"></div><canvas id="cv"></canvas>

  <div class="layer" id="menu">
    <div class="mtop"><div class="logo">TURBO<br>RUSH<small>ENDLESS RACING</small></div><button class="ib" id="setBtn" aria-label="Settings">⚙️</button></div>
    <div class="best"><span>BEST SCORE</span><b id="mBest">0</b><span>COINS 🪙</span><b id="mCoin">0</b></div>
    <div class="carwrap" id="pvWrap"><canvas id="pv"></canvas><div id="lockI" class="hide">🔒</div><button class="arr l" id="prevBtn" aria-label="Previous">‹</button><button class="arr r" id="nextBtn" aria-label="Next">›</button></div>
    <div class="vinfo"><b id="vName"></b><span class="t" id="vType"></span>
      <div class="stats"><div class="st">SPEED<i><u id="s1"></u></i></div><div class="st">HANDLING<i><u id="s2"></u></i></div><div class="st">STRENGTH<i><u id="s3"></u></i></div></div></div>
    <div class="dots" id="dots"></div>
    <div class="tracks" id="tracks"></div>
    <button class="start" id="startBtn">START ▶</button>
  </div>

  <div class="layer hide" id="hud">
    <div class="htop"><button class="hb" id="pauseBtn" aria-label="Pause">⏸</button><div class="hsc"><b id="hScore">0</b><span>SCORE</span></div><div class="hsp"><b id="hSpeed">0</b><span>KM/H</span></div></div>
    <div id="shield"></div><div id="cd"></div>
    <div id="coinHud">🪙 <span id="hCoin">0</span></div><button class="hb" id="ctlBtn">👆</button><button class="cbtn l hide" id="bL">◀</button><button class="cbtn r hide" id="bR">▶</button><button class="boost off" id="boostBtn" aria-label="Boost">⚡<i id="bCnt">0</i></button>
  </div>

  <div class="layer hide" id="pause"><div class="panel"><h2>PAUSED</h2><p>Take a breath, champ!</p><button class="pb" id="resBtn">Resume ▶</button><button class="pb g" id="pSetBtn">⚙️ Settings</button><button class="pb g" id="pMenuBtn">Menu</button></div></div>
  <div class="layer hide" id="over"><div class="panel"><h2>CRASH!</h2><div class="big" id="oScore">0</div><p id="oMsg"></p><button class="pb" id="againBtn">Play Again ↻</button><button class="pb g" id="oMenuBtn">Menu</button></div></div>
</div>
<footer id="foot" class="f0">
  <div class="copy">Copyright &copy; <strong>Amrit Bharadwaj</strong> All Rights Reserved</div>
  <div class="adbar"><div class="adcard"><div class="adlabel">Advertisement</div><div class="adslot" id="adslot"><div class="ad-fallback" id="adFallback">Ad loading… (320×50)</div></div></div></div>
</footer>
</div>

<div class="modal" id="setModal"><div class="box"><h3>⚙️ Settings</h3>
  <div class="row"><label>Master volume <span id="vm">80</span></label><input type="range" id="rMaster" min="0" max="100"></div>
  <div class="row"><label>Music <span id="vmu">60</span></label><input type="range" id="rMusic" min="0" max="100"></div>
  <div class="row"><label>Engine &amp; effects <span id="vs">80</span></label><input type="range" id="rSfx" min="0" max="100"></div>
  <div class="row"><button class="opt" id="ctlOpt">Controls: Touch</button></div>
  <div class="row"><button class="opt" id="vibBtn">Vibration: On</button></div>
  <button class="pb" id="setDone">Done</button></div></div>

function spawnRow(){if(++rowN%4===0){var ns=clamp(safe+(Math.random()<.5?-1:1),0,3),bz=false;for(var q=0;q<obs.length;q++)if(obs[q].lane===ns&&obs[q].y<420-FAR)bz=true;if(!bz)safe=ns;}
  var lanes=[0,1,2,3],cand=[],i,n=1,p2=clamp(.2+elapsed/150,.2,.6),p3=clamp((elapsed-20)/90,0,.35);

function update(dt){
  time+=dt;var i,o,p;
  if(state==='pause')return;
  if(state==='menu'){scroll+=140*dt;if(!decor.length||scroll>=nextDecor){decorSpawn();nextDecor=scroll+R(50,110);}decorMove(140,dt);
    if(!pvDrag)pvPos+=(vi-pvPos)*(1-Math.exp(-dt*12));return;}
  var v=P1.veh;
  /* lateral smoothing */
  var rate=v.hand,dx=P1.tx-P1.x;P1.x+=dx*(1-Math.exp(-dt*rate));P1.rot=clamp(dx*.014,-.38,.38)+(state==='over'?0:0);
  if(P1.inv>0)P1.inv-=dt;
  if(state==='over'){
    crashT+=dt;vNow*=Math.exp(-3*dt);scroll+=vNow*dt;P1.rot+=P1.spin*dt;P1.x+=P1.spin*6*dt;decorMove(vNow,dt);
    for(i=0;i<obs.length;i++)obs[i].y+=(vNow-obs[i].vt*Math.exp(-3*crashT))*dt;
    fx(dt);if(crashT>.95&&!overShown){overShown=true;mode='menu';$('hud').classList.add('hide');$('over').classList.remove('hide');}
    return;
  }
  if(state==='count'){
    var pc=Math.ceil(cd-.4);cd-=dt;var nc=Math.ceil(cd-.4);
    if(nc!==pc){if(nc>0){sfx.beep(false);}else{sfx.beep(true);}}
    $('cd').textContent=nc>0?nc:(cd>0?'GO!':'');vNow=Math.min(260,vNow+240*dt);
    if(cd<=0){state='play';mode='play';$('cd').textContent='';}
  }else{
    elapsed+=dt;
    var base=Math.min(v.top,300+elapsed*9);
    if(boostT>0){boostT-=dt;if(boostT<=0)updBoostUI();}
    bm+=((boostT>0?1.3:1)-bm)*(1-Math.exp(-dt*4));vNow=base*bm;
    dist+=vNow*dt;score+=vNow*dt*.035*(boostT>0?2:1);
    if(dist>=nextRow){spawnRow();nextRow=dist+clamp(vNow*R(.75,1.05),300,720);}
    if(dist>=nextCoin){spawnCoins();nextCoin=dist+R(1600,2800);}
    if(dist>=nextBoost){spawnBoost();nextBoost=dist+R(4200,6800);}
  }
  scroll+=vNow*dt;spd01=clamp(vNow/(v.top*1.5),0,1);engSet(spd01);
  if(scroll>=nextDecor){decorSpawn();nextDecor=scroll+R(50,110);}decorMove(vNow,dt);
  comboT-=dt;if(comboT<=0)combo=0;
  var hw=v.hw/2,hh=v.hh/2;
  for(i=obs.length-1;i>=0;i--){
    o=obs[i];var py0=o.y;o.y+=(vNow-o.vt)*dt;
    if(o.y>LH+160){obs.splice(i,1);continue;}
    if(o.dead)continue;
    if(state==='play'){
      if(Math.abs(o.x-P1.x)<hw+Math.max(o.w,64)/2-3&&Math.abs(o.y-PY)<hh+o.hh/2-2){
        if(P1.inv>0)continue;
        if(P1.armor>0){P1.armor--;P1.inv=1.6;shake=.35;sfx.hit();spark(o.x,o.y,18,'#ffb300',200);o.dead=true;obs.splice(i,1);updShield();pop(P1.x,PY-50,'SHIELD HIT','#ff7043');if(SET.vib)try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}}
        else{crash();return;}
        continue;
      }
      if(!o.nm&&py0<PY&&o.y>=PY){o.nm=true;var gap=Math.abs(o.x-P1.x)-(hw+o.w/2);if(gap<14&&gap>-2){score+=25;sfx.near();pop(P1.x,PY-40,'NEAR MISS +25','#ffb300');}}
    }
  }
  for(i=pick.length-1;i>=0;i--){
    p=pick[i];p.y+=vNow*dt;if(p.y>LH+60){pick.splice(i,1);continue;}
    if(state==='play'&&Math.abs(p.x-P1.x)<hw+14&&Math.abs(p.y-PY)<hh+12){
      if(p.t==='coin'){combo++;comboT=1.2;score+=10;SET.coins+=5;updCoins();sfx.coin(combo);pop(p.x,PY-30,'+10','#ffb300');spark(p.x,p.y,5,'#ffd54f',90);}
      else{if(boosts<3){boosts++;}else{score+=100;}sfx.pick();pop(p.x,PY-40,boosts>=3?'⚡ MAX':'+⚡','#29b6f6');spark(p.x,p.y,14,'#4dd0ff',160);updBoostUI();}
      pick.splice(i,1);
    }
  }
  fx(dt);
  if(boostT>0&&Math.random()<.9){parts.push({x:P1.x+R(-5,5),y:PY+hh,vx:R(-20,20),vy:R(120,220),l:.35,m:.35,c:Math.random()<.5?'#ffb300':'#29b6f6',s:R(2,4)});}
  if(boostT>0)shake=Math.max(shake,.06);
  var now=performance.now();if(now-lastHud>90){lastHud=now;$('hScore').textContent=Math.floor(score);$('hSpeed').textContent=Math.round(vNow*.85);}
}

  for(i=0;i<parts.length;i++){q=parts[i];p=scr(q.x,q.y);c.globalAlpha=clamp(q.l/q.m,0,1);c.fillStyle=q.c;c.fillRect(p[0]-q.s/2,p[1]-q.s/2,q.s*1.6,q.s*1.6);}
  c.globalAlpha=1;c.textAlign='center';c.font='900 17px Segoe UI,Arial';
  for(i=0;i<pops.length;i++){q=pops[i];p=scr(q.x,q.y);c.globalAlpha=clamp(q.t,0,1);c.fillStyle='rgba(0,0,0,.5)';c.fillText(q.txt,p[0]+1,p[1]+1);c.fillStyle=q.col;c.fillText(q.txt,p[0],p[1]);}
  c.globalAlpha=1;if(flash>0){c.fillStyle='rgba(255,255,255,'+clamp(flash*.6,0,.6)+')';c.fillRect(0,0,W,LH);}
}

/* =================== MENU UI =================== */
function setVeh(i,quiet){vi=clamp(i,0,VEH.length-1);SET.veh=vi;save();var v=VEH[vi];
  $('vName').textContent=v.n;$('startBtn').textContent=SET.owned[vi]?'START ▶':'BUY 🪙 '+v.price;$('lockI').classList.toggle('hide',!!SET.owned[vi]);$('vType').textContent=v.t;$('s1').style.width=(v.top/950*100)+'%';$('s2').style.width=(v.hand/15*100)+'%';$('s3').style.width=(v.str/5*100)+'%';
  var d='';for(var k=0;k<VEH.length;k++)d+='<i class="'+(k===vi?'on':'')+'"></i>';$('dots').innerHTML=d;if(!quiet)sfx.click();}
function setTrack(i,quiet){ti=i;SET.trk=i;save();var h='';TRK.forEach(function(t,k){h+='<button class="trk t'+k+(k===ti?' on':'')+'" data-t="'+k+'"><i>'+t.e+'</i>'+t.n+'</button>';});$('tracks').innerHTML=h;decor=[];scroll=0;$('foot').className='f'+ti;applyTrack3D();if(!quiet)sfx.click();}
$('tracks').addEventListener('click',function(e){var b=e.target.closest('.trk');if(b){aud();startMusic();setTrack(+b.dataset.t);}});
$('prevBtn').onclick=function(){aud();startMusic();setVeh(vi-1);};$('nextBtn').onclick=function(){aud();startMusic();setVeh(vi+1);};
var pvW=$('pvWrap');
pvW.addEventListener('pointerdown',function(e){if(e.target.closest&&e.target.closest('.arr'))return;aud();startMusic();pvDrag={x:e.clientX,p:pvPos,lx:e.clientX,lt:performance.now(),v:0};try{pvW.setPointerCapture(e.pointerId);}catch(x){}});
pvW.addEventListener('pointermove',function(e){if(!pvDrag)return;var n=performance.now(),w=pvW.clientWidth*.78;pvPos=clamp(pvDrag.p-(e.clientX-pvDrag.x)/w,-.4,VEH.length-.6);pvDrag.v=(e.clientX-pvDrag.lx)/Math.max(1,n-pvDrag.lt);pvDrag.lx=e.clientX;pvDrag.lt=n;});
function pvEnd(){if(!pvDrag)return;var w=pvW.clientWidth*.78,t=Math.round(pvPos-pvDrag.v*160/w);pvDrag=null;setVeh(t);}
pvW.addEventListener('pointerup',pvEnd);pvW.addEventListener('pointercancel',pvEnd);
$('startBtn').onclick=startGame;

/* =================== INPUT (in game) =================== */
function lx(e){var r=stage.getBoundingClientRect();return (e.clientX-r.left)/sc;}
var drag=null;
stage.addEventListener('pointerdown',function(e){
  if(SET.ctl||(state!=='play'&&state!=='count'))return;if(e.target.closest&&e.target.closest('button'))return;
  var x=lx(e);drag={x0:x,t0:performance.now(),moved:false};P1.tx=clamp(x,LX[0],LX[3]);try{stage.setPointerCapture(e.pointerId);}catch(x2){}
});
stage.addEventListener('pointermove',function(e){if(!drag)return;var x=lx(e);if(Math.abs(x-drag.x0)>6)drag.moved=true;P1.tx=clamp(x,LX[0],LX[3]);});
function endDrag(){if(!drag)return;P1.tx=LX[laneOf(P1.tx)];drag=null;}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
addEventListener('keydown',function(e){
  var k=e.key;
  if(state==='play'||state==='count'){
    if(k==='ArrowLeft'||k==='a'||k==='A'){P1.tx=LX[clamp(laneOf(P1.tx)-1,0,3)];e.preventDefault();}
    else if(k==='ArrowRight'||k==='d'||k==='D'){P1.tx=LX[clamp(laneOf(P1.tx)+1,0,3)];e.preventDefault();}
    else if(k===' '||k==='ArrowUp'||k==='b'||k==='B'){useBoost();e.preventDefault();}
    else if(k==='p'||k==='P'||k==='Escape')doPause();
  }else if(state==='pause'&&(k==='p'||k==='P'||k==='Escape'))doResume();
  else if(state==='menu'&&$('setModal').style.display!=='flex'){if(k==='ArrowLeft')setVeh(vi-1);else if(k==='ArrowRight')setVeh(vi+1);else if(k==='Enter')startGame();}
});
$('boostBtn').addEventListener('pointerdown',function(e){e.stopPropagation();useBoost();});
$('pauseBtn').onclick=doPause;$('resBtn').onclick=doResume;$('pMenuBtn').onclick=toMenu;$('oMenuBtn').onclick=toMenu;$('againBtn').onclick=startGame;
document.addEventListener('visibilitychange',function(){if(document.hidden)doPause();});
document.addEventListener('pointerdown',function(){aud();startMusic();},{once:true});

/* =================== SETTINGS =================== */
function sync(){$('rMaster').value=Math.round(SET.master*100);$('rMusic').value=Math.round(SET.music*100);$('rSfx').value=Math.round(SET.sfx*100);
  $('vm').textContent=Math.round(SET.master*100);$('vmu').textContent=Math.round(SET.music*100);$('vs').textContent=Math.round(SET.sfx*100);$('vibBtn').textContent='Vibration: '+(SET.vib?'On':'Off');$('vibBtn').classList.toggle('on',!!SET.vib);}
function bind(id,key){$(id).addEventListener('input',function(){SET[key]=$(id).value/100;vol();save();sync();});}
bind('rMaster','master');bind('rMusic','music');bind('rSfx','sfx');
$('rSfx').addEventListener('change',function(){sfx.coin(0);});
$('vibBtn').onclick=function(){SET.vib=SET.vib?0:1;save();sync();if(SET.vib)try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}};
function openSet(){aud();startMusic();sync();$('setModal').style.display='flex';}
$('setBtn').onclick=openSet;$('pSetBtn').onclick=openSet;$('setDone').onclick=function(){$('setModal').style.display='none';};

function applyCtl(){$('bL').classList.toggle('hide',!SET.ctl);$('bR').classList.toggle('hide',!SET.ctl);$('ctlBtn').textContent=SET.ctl?'🎮':'👆';$('ctlOpt').textContent='Controls: '+(SET.ctl?'Buttons':'Touch');}
function togCtl(){SET.ctl=SET.ctl?0:1;save();applyCtl();sfx.click();P1.tx=LX[laneOf(P1.tx)];}
$('ctlBtn').onclick=togCtl;$('ctlOpt').onclick=togCtl;
function stepL(d){return function(e){e.stopPropagation();if(state==='play'||state==='count')P1.tx=LX[clamp(laneOf(P1.tx)+d,0,3)];};}
$('bL').addEventListener('pointerdown',stepL(-1));$('bR').addEventListener('pointerdown',stepL(1));
/* =================== LOOP =================== */
var last=0;
var lastRun=null,lastMn=null;
function frame(now){var mn=state==='menu';if(mn!==lastMn){lastMn=mn;if(GLr)gradeFx(!mn);$('foot').classList.toggle('inmenu',mn);}var run=state==='play'||state==='count';if(run!==lastRun){lastRun=run;$('foot').classList.toggle('stop',!run);}var dt=Math.min(.05,((now||0)-last)/1000);last=now||0;if(dt>0){update(dt);render();}requestAnimationFrame(frame);}
buildMenu3D();setVeh(vi,true);setTrack(ti,true);applyCtl();updCoins();$('mBest').textContent=Math.floor(BEST);resize();
window.__TR={VEH:VEH,KIND:KIND,TRK:TRK,draw:{car:car,van:van,truck:truck,rick:rick,tractor:tractor,hay:hay,barrier:barrier,bike:bike},update:update,render:render,startGame:startGame,doPause:doPause,doResume:doResume,toMenu:toMenu,useBoost:useBoost,setTrack:setTrack,setVeh:setVeh,
  S:function(){return {state:state,score:score,vNow:vNow,obs:obs,pick:pick,P1:P1,boosts:boosts,boostT:boostT,elapsed:elapsed,LH:LH,PY:PY,BEST:BEST};},force:function(o){for(var k in o){if(k==='boosts')boosts=o[k];if(k==='elapsed')elapsed=o[k];}}};
requestAnimationFrame(frame);
})();
</script>
